<!DOCTYPE html>
<!--
  Static tool. These files run in the visitor's browser.
  Nothing on this page is sent to the machine that served the files.
  The event timer uses only the files in this folder and this browser's storage.
  The account panel, when used, calls https://api.guildwars2.com directly from this browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14">
  <title>Gw2 Event Timer</title>
  <link rel="icon" href="assets/icon.png?v=15" type="image/png">
  <link rel="stylesheet" href="app.css?v=27">
  <link rel="stylesheet" href="account.css?v=20">
</head>
<body>
  <header class="bar">
    <div class="top">
      <div id="tool-shelf" class="tool-shelf"></div>
      <div class="brand">
        <div class="logo-line">
          <img class="logo" src="assets/icon.png?v=15" alt="">
          <h1 id="title">Gw2 Event Timer</h1>
        </div>
        <p id="clock"></p>
      </div>
      <div class="tools">
        <span id="api-sync" class="api-sync" hidden></span>
        <button type="button" id="account" class="tool" aria-pressed="false">Account</button>
        <button type="button" id="sound" class="tool" aria-pressed="false">Enable sound</button>
        <a class="tool git-link" href="https://github.com/wilbresley/gw2-event-timer" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.68 7.68 0 0 1 8 4.77c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
          GitHub
        </a>
        <a class="tool sponsor-link" href="https://github.com/sponsors/wilbresley" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.25 2.5c-1.336 0-2.75 1.164-2.75 3 0 2.15 1.58 4.144 3.365 5.682A20.565 20.565 0 0 0 8 13.393a20.561 20.561 0 0 0 3.135-2.211C12.92 9.644 14.5 7.65 14.5 5.5c0-1.836-1.414-3-2.75-3-1.373 0-2.609.986-3.029 2.456a.749.749 0 0 1-1.442 0C6.859 3.486 5.623 2.5 4.25 2.5z"></path></svg>
          Sponsor
        </a>
        <button type="button" class="tool" id="pix" data-pix="a8d44088-1b08-465d-aac1-29ca42014692">Pix</button>
      </div>
    </div>
    <input id="search" class="search" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false">
    <nav id="queues" class="filters" aria-label="Queues"></nav>
    <nav id="filters" class="filters" aria-label="Filters"></nav>
  </header>
  <div id="api-down" class="api-down" hidden>
    <strong>ArenaNet's API is not responding</strong>
    <p>It looks like the API is in maintenance. The account panel stays closed. Try again later. The event timer keeps running.</p>
  </div>
  <main id="list" class="list"></main>
  <div id="account-view" hidden></div>
  <p class="foot credit">Version 1.0.1 · Bresleywil.2384</p>
  <p id="foot" class="foot"></p>
  <dialog id="pix-modal" class="pix-modal">
    <h2>Pix</h2>
    <p>Scan with a Brazilian bank app. You choose the amount.</p>
    <img src="assets/pix-qr.png?v=1" alt="Pix QR code" width="240" height="240">
    <div class="pix-actions">
      <button type="button" class="tool" id="pix-copy">Copy key</button>
      <button type="button" class="tool" id="pix-close">Close</button>
    </div>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <button type="button" id="alarm" class="alarm" hidden></button>
  <script src="data.js?v=12"></script>
  <script src="app.js?v=29"></script>
  <script src="account.js?v=37"></script>
</body>
</html>
