<!DOCTYPE html>
<!--
  Cloudflare Pages serves this file, with a 404 status, for a path that does
  not exist. Without a top-level 404.html, Pages assumes a single-page app and
  answers every missing path with index.html and status 200, which hides a
  renamed file behind an HTML page. The container path uses the try_files rule
  in nginx.conf for the same reason.

  Keep this file self-contained: no script, no external css, so it renders even
  when the rest of the site failed to deploy.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14">
  <meta name="robots" content="noindex">
  <title>Page not found · Gw2 Event Timer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.5rem;
      background: #0c0f14;
      color: #f3f5f8;
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 1.9rem); }
    p { margin: 0; max-width: 30rem; color: #8e98ab; line-height: 1.5; }
    a {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      border: 1px solid #2a3142;
      border-radius: 0.6rem;
      background: #171c26;
      color: #f3f5f8;
      font-size: 0.95rem;
      text-decoration: none;
    }
    a:hover, a:focus-visible { border-color: #d7b36a; }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>The address you opened is not part of this site. The event timer is on the home page.</p>
  <a href="/">Go to the event timer</a>
</body>
</html>
