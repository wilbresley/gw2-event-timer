<!DOCTYPE html>
<!--
  Cloudflare Pages serves this file, with a 404 status, for a path that does
  not exist. Without a top-level 404.html, Pages assumes a single-page app and
  answers every missing path with index.html and status 200, which hides a
  renamed file behind an HTML page. The container path uses the try_files rule
  in nginx.conf for the same reason.

  The page has no script. It uses one same-origin stylesheet, /404.css, so the
  CSP can stay style-src 'self' (no unsafe-inline). If the stylesheet is
  missing, the text still renders readable.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14">
  <meta name="robots" content="noindex">
  <title>Page not found · Gw2 Event Timer</title>
  <link rel="stylesheet" href="/404.css">
</head>
<body>
  <h1>Page not found</h1>
  <p>The address you opened is not part of this site. The event timer is on the home page.</p>
  <a href="/">Go to the event timer</a>
</body>
</html>
