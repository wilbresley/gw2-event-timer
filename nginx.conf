server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    # The page is text-heavy, so compress the types it actually serves.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Nothing on this page needs a camera, a microphone, or a location.
    # These stay at server level on purpose: add_header in a location would replace them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), fullscreen=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self'; img-src 'self' data: https://render.guildwars2.com; media-src 'self'; connect-src 'self' https://api.guildwars2.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # A missing file must be a 404, not the HTML page with status 200.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|mp3|webp|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
